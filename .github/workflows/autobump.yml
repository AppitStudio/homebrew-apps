name: brew bump

on:
  schedule:
    # Every day at 20:35 UTC
    - cron: 35 20 * * *
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  autobump:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1

      - name: Bump outdated casks
        id: bump
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: |
          bumped=0
          for file in "$(brew --repository "$TAP_NAME")"/Casks/*.rb; do
            token="$(basename "$file" .rb)"
            json="$(brew livecheck --cask --json "$TAP_NAME/$token")"
            outdated="$(jq -r '.[0].version.outdated' <<<"$json")"
            latest="$(jq -r '.[0].version.latest' <<<"$json")"
            if [[ "$outdated" != "true" || -z "$latest" || "$latest" == "null" ]]; then
              echo "$token is up to date"
              continue
            fi
            # --write-only --commit updates version + sha256 and commits locally,
            # so no pull request permission is needed. --version is required:
            # bump-cask-pr does not read livecheck itself.
            brew bump-cask-pr --write-only --commit --version "$latest" "$TAP_NAME/$token"
            bumped=1
          done
          echo "bumped=$bumped" >> "$GITHUB_OUTPUT"

      - name: Push commits
        if: steps.bump.outputs.bumped == '1'
        uses: Homebrew/actions/git-try-push@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
          branch: main
