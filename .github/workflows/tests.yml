name: brew test

on:
  push:
    branches:
      - main
    paths:
      - 'Casks/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'Casks/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["macos-26"]' || '["macos-26","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3 # 2026.11.02.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Run brew style
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew style "$TAP_NAME"

      - name: Run brew audit
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew audit --cask --online --tap "$TAP_NAME"

      - name: Run brew livecheck
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew livecheck --cask --tap "$TAP_NAME" --json

      - name: Install and uninstall each cask
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: |
          for cask in "$(brew --repository "$TAP_NAME")"/Casks/*.rb; do
            token="$(basename "$cask" .rb)"
            brew install --cask "$TAP_NAME/$token"
            brew uninstall --zap --cask "$TAP_NAME/$token"
          done
